name: Deploy VINSS Contract - Mainnet

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate only, or perform a real Mainnet declaration + deployment"
        required: true
        default: "validate-only"
        type: choice
        options:
          - validate-only
          - deploy
      contract:
        description: "Contract to validate/deploy"
        required: true
        type: choice
        options:
          - VinssMessageHelper
          - VinssInvite
          - VinssOfferHelper
          - VinssPrivateEscrowHelper
          - VinssEscrowRekber
          - VinssSettlementCertificate
      confirm_mainnet:
        description: "For deploy mode only: type DEPLOY_MAINNET"
        required: false
        default: ""
        type: string
      escrow_rekber_address:
        description: "Required only for VinssSettlementCertificate"
        required: false
        default: ""
        type: string
      certificate_base_uri:
        description: "Settlement Certificate metadata base URI"
        required: false
        default: "https://vinss-nu.vercel.app/api/certificates/"
        type: string

concurrency:
  group: vinss-mainnet-contract-deploy
  cancel-in-progress: false

jobs:
  mainnet:
    name: ${{ inputs.mode }} · ${{ inputs.contract }} · Starknet Mainnet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: mainnet

    defaults:
      run:
        working-directory: contracts
        shell: bash

    env:
      DEPLOY_MODE: ${{ inputs.mode }}
      CONTRACT_NAME: ${{ inputs.contract }}
      CONFIRM_MAINNET: ${{ inputs.confirm_mainnet }}
      ESCROW_REKBER_ADDRESS: ${{ inputs.escrow_rekber_address }}
      CERTIFICATE_BASE_URI: ${{ inputs.certificate_base_uri }}

      ACCOUNT_ADDRESS: ${{ vars.VINSS_MAINNET_DEPLOYER_ADDRESS }}
      PRIVACY_POOL_ADDRESS: ${{ vars.MAINNET_PRIVACY_POOL_ADDRESS }}
      OPEN_NOTE_TOKEN_ADDRESS: ${{ vars.MAINNET_OPEN_NOTE_TOKEN_ADDRESS }}
      TREASURY_ADDRESS: ${{ vars.VINSS_MAINNET_TREASURY_ADDRESS }}

    steps:
      # IMPORTANT: checkout MUST be first because this job's shell working
      # directory is contracts/. Before checkout that directory does not exist.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Mainnet safety gate
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Mainnet actions are only allowed from the main branch."
            exit 1
          fi

          case "$DEPLOY_MODE" in
            validate-only)
              echo "VALIDATE-ONLY MODE: no transaction will be submitted."
              ;;
            deploy)
              if [ "$CONFIRM_MAINNET" != "DEPLOY_MAINNET" ]; then
                echo "Real deployment requires confirm_mainnet=DEPLOY_MAINNET."
                exit 1
              fi
              ;;
            *)
              echo "Unsupported mode: $DEPLOY_MODE"
              exit 1
              ;;
          esac

          valid_address() {
            [[ "$1" =~ ^0x[0-9a-fA-F]{1,64}$ ]]
          }

          if ! valid_address "$ACCOUNT_ADDRESS"; then
            echo "VINSS_MAINNET_DEPLOYER_ADDRESS is missing or invalid."
            exit 1
          fi

          if ! valid_address "$TREASURY_ADDRESS"; then
            echo "VINSS_MAINNET_TREASURY_ADDRESS is missing or invalid."
            exit 1
          fi

          case "$CONTRACT_NAME" in
            VinssMessageHelper|VinssOfferHelper|VinssInvite)
              if ! valid_address "$PRIVACY_POOL_ADDRESS"; then
                echo "MAINNET_PRIVACY_POOL_ADDRESS is missing or invalid."
                exit 1
              fi
              if ! valid_address "$OPEN_NOTE_TOKEN_ADDRESS"; then
                echo "MAINNET_OPEN_NOTE_TOKEN_ADDRESS is missing or invalid."
                exit 1
              fi
              ;;
            VinssPrivateEscrowHelper|VinssEscrowRekber)
              if ! valid_address "$PRIVACY_POOL_ADDRESS"; then
                echo "MAINNET_PRIVACY_POOL_ADDRESS is missing or invalid."
                exit 1
              fi
              ;;
            VinssSettlementCertificate)
              if ! valid_address "$ESCROW_REKBER_ADDRESS"; then
                echo "A valid escrow_rekber_address is required."
                exit 1
              fi
              if ! [[ "$CERTIFICATE_BASE_URI" =~ ^https://[^\",[:space:]]+/$ ]]; then
                echo "certificate_base_uri must be HTTPS and end with /."
                exit 1
              fi
              ;;
            *)
              echo "Unsupported contract: $CONTRACT_NAME"
              exit 1
              ;;
          esac

      - name: Verify Starknet Mainnet RPC
        env:
          STARKNET_RPC_URL: ${{ secrets.STARKNET_MAINNET_RPC_URL }}
        run: |
          set -euo pipefail
          test -n "$STARKNET_RPC_URL"

          CHAIN_ID="$(
            curl --fail --silent --show-error \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"starknet_chainId","params":[]}' \
              "$STARKNET_RPC_URL" \
            | jq -r '.result // empty'
          )"

          if [ "$CHAIN_ID" != "0x534e5f4d41494e" ]; then
            echo "Refusing operation: RPC is not Starknet Mainnet (SN_MAIN)."
            exit 1
          fi

          echo "RPC verified: Starknet Mainnet."

      - name: Setup Scarb
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd
        with:
          scarb-version: 2.17.0

      # Keep tests aligned with contracts/Scarb.toml (snforge_std 0.56.0).
      - name: Setup Starknet Foundry for tests
        uses: foundry-rs/setup-snfoundry@bd5fc266ba0ce7e352b01dd7eaacc0fbb6145d17
        with:
          starknet-foundry-version: 0.56.0

      - name: Verify test toolchain
        run: |
          set -euo pipefail
          scarb --version
          snforge --version
          sncast --version

      - name: Build
        id: build
        run: |
          set -euo pipefail
          set -o pipefail
          scarb build 2>&1 | tee build-output.txt

      - name: Export ABI
        id: abi
        run: |
          set -euo pipefail

          CLASS_FILE="$(
            find target/dev \
              -type f \
              -name "*_${CONTRACT_NAME}.contract_class.json" \
              -print \
            | head -1
          )"

          if [ -z "$CLASS_FILE" ] || [ ! -f "$CLASS_FILE" ]; then
            echo "Compiled contract class not found for $CONTRACT_NAME."
            find target/dev -maxdepth 2 -type f -name '*.contract_class.json' -print || true
            exit 1
          fi

          ARTIFACT_DIR="mainnet-artifacts/$CONTRACT_NAME"
          mkdir -p "$ARTIFACT_DIR"

          jq '.abi' "$CLASS_FILE" > "$ARTIFACT_DIR/${CONTRACT_NAME}.abi.json"
          sha256sum "$CLASS_FILE" > "$ARTIFACT_DIR/compiled-class.sha256"
          printf '%s\n' "$CLASS_FILE" > "$ARTIFACT_DIR/compiled-class-path.txt"

          echo "artifact_dir=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"

          echo "ABI exported:"
          ls -lh "$ARTIFACT_DIR/${CONTRACT_NAME}.abi.json"

      - name: Test
        id: test
        run: |
          set -euo pipefail
          set -o pipefail
          snforge test 2>&1 | tee test-output.txt

      # Newer sncast is used only after the 0.56.0 test suite completes.
      - name: Setup Starknet Foundry for Mainnet operations
        uses: foundry-rs/setup-snfoundry@bd5fc266ba0ce7e352b01dd7eaacc0fbb6145d17
        with:
          starknet-foundry-version: 0.63.0

      - name: Verify deployment toolchain
        run: |
          set -euo pipefail
          VERSION="$(sncast --version)"
          echo "$VERSION"
          echo "$VERSION" | grep -q '0.63.0'

      - name: Import dedicated deployer
        env:
          STARKNET_RPC_URL: ${{ secrets.STARKNET_MAINNET_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.VINSS_MAINNET_DEPLOYER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077

          test -n "$STARKNET_RPC_URL"
          test -n "$PRIVATE_KEY"

          KEY_FILE="$RUNNER_TEMP/vinss-mainnet-deployer.key"
          printf '%s' "$PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          sncast account import \
            --url "$STARKNET_RPC_URL" \
            --name vinss-mainnet-deployer \
            --address "$ACCOUNT_ADDRESS" \
            --private-key-file "$KEY_FILE" \
            --type oz \
            --silent

          rm -f "$KEY_FILE"

      - name: Prepare constructor arguments
        id: constructor
        run: |
          set -euo pipefail

          case "$CONTRACT_NAME" in
            VinssMessageHelper|VinssOfferHelper|VinssInvite)
              DEPLOY_ARGS="$PRIVACY_POOL_ADDRESS, $OPEN_NOTE_TOKEN_ADDRESS"
              ;;
            VinssPrivateEscrowHelper|VinssEscrowRekber)
              DEPLOY_ARGS="$PRIVACY_POOL_ADDRESS"
              ;;
            VinssSettlementCertificate)
              DEPLOY_ARGS="$ESCROW_REKBER_ADDRESS, \"$CERTIFICATE_BASE_URI\""
              ;;
            *)
              echo "Unsupported contract: $CONTRACT_NAME"
              exit 1
              ;;
          esac

          echo "args=$DEPLOY_ARGS" >> "$GITHUB_OUTPUT"

      # A class that is not yet declared cannot be reliably dry-run-deployed.
      # Therefore validate-only safely estimates the DECLARE transaction.
      - name: Estimate Mainnet declaration fee - dry run only
        id: declare_fee
        env:
          STARKNET_RPC_URL: ${{ secrets.STARKNET_MAINNET_RPC_URL }}
        run: |
          set -euo pipefail
          set -o pipefail

          ARTIFACT_DIR="${{ steps.abi.outputs.artifact_dir }}"

          echo "=== MAINNET DECLARE DRY RUN: $CONTRACT_NAME ==="
          echo "No transaction is submitted by this step."

          sncast \
            --scarb-profile dev \
            --account vinss-mainnet-deployer \
            declare \
            --url "$STARKNET_RPC_URL" \
            --contract-name "$CONTRACT_NAME" \
            --dry-run \
            --detailed \
            2>&1 | tee "$ARTIFACT_DIR/declare-fee-estimate.txt"

          echo ""
          echo "=== DECLARE FEE LINES ==="
          grep -Ei 'fee|gas|fri|strk' "$ARTIFACT_DIR/declare-fee-estimate.txt" || true

      - name: Declare class on Mainnet
        id: declare
        if: inputs.mode == 'deploy'
        env:
          STARKNET_RPC_URL: ${{ secrets.STARKNET_MAINNET_RPC_URL }}
        run: |
          set -euo pipefail
          set -o pipefail

          ARTIFACT_DIR="${{ steps.abi.outputs.artifact_dir }}"

          sncast \
            --scarb-profile dev \
            --account vinss-mainnet-deployer \
            --wait \
            --wait-timeout 300 \
            declare \
            --url "$STARKNET_RPC_URL" \
            --contract-name "$CONTRACT_NAME" \
            2>&1 | tee "$ARTIFACT_DIR/declare-output.txt"

          CLASS_HASH="$(
            grep -i 'Class Hash:' "$ARTIFACT_DIR/declare-output.txt" \
            | awk '{print $3}' \
            | tail -1
          )"
          DECLARE_TX="$(
            grep -i 'Transaction Hash:' "$ARTIFACT_DIR/declare-output.txt" \
            | awk '{print $3}' \
            | tail -1
          )"

          if [ -z "$CLASS_HASH" ]; then
            echo "Could not parse class hash from declaration output."
            exit 1
          fi

          {
            echo "class_hash=$CLASS_HASH"
            echo "transaction_hash=$DECLARE_TX"
          } >> "$GITHUB_OUTPUT"

      # Once the class exists on Mainnet, this dry-run can estimate the actual
      # instance deployment transaction without submitting it.
      - name: Estimate Mainnet deployment fee - dry run only
        id: deploy_fee
        if: inputs.mode == 'deploy' && steps.declare.outcome == 'success'
        env:
          STARKNET_RPC_URL: ${{ secrets.STARKNET_MAINNET_RPC_URL }}
          DEPLOY_ARGS: ${{ steps.constructor.outputs.args }}
          CLASS_HASH: ${{ steps.declare.outputs.class_hash }}
        run: |
          set -euo pipefail
          set -o pipefail

          ARTIFACT_DIR="${{ steps.abi.outputs.artifact_dir }}"

          sncast \
            --scarb-profile dev \
            --account vinss-mainnet-deployer \
            deploy \
            --url "$STARKNET_RPC_URL" \
            --contract-name "$CONTRACT_NAME" \
            --arguments "$DEPLOY_ARGS" \
            --dry-run \
            --detailed \
            2>&1 | tee "$ARTIFACT_DIR/deploy-fee-estimate.txt"

          echo ""
          echo "=== DEPLOY FEE LINES ==="
          grep -Ei 'fee|gas|fri|strk' "$ARTIFACT_DIR/deploy-fee-estimate.txt" || true

      - name: Deploy contract instance to Mainnet
        id: deploy
        if: inputs.mode == 'deploy' && steps.declare.outcome == 'success' && steps.deploy_fee.outcome == 'success'
        env:
          STARKNET_RPC_URL: ${{ secrets.STARKNET_MAINNET_RPC_URL }}
          DEPLOY_ARGS: ${{ steps.constructor.outputs.args }}
          CLASS_HASH: ${{ steps.declare.outputs.class_hash }}
        run: |
          set -euo pipefail
          set -o pipefail

          ARTIFACT_DIR="${{ steps.abi.outputs.artifact_dir }}"

          # Use --contract-name here so Cairo-expression constructor arguments
          # (including the certificate ByteArray URI) are transformed using ABI.
          sncast \
            --scarb-profile dev \
            --account vinss-mainnet-deployer \
            --wait \
            --wait-timeout 300 \
            deploy \
            --url "$STARKNET_RPC_URL" \
            --contract-name "$CONTRACT_NAME" \
            --arguments "$DEPLOY_ARGS" \
            2>&1 | tee "$ARTIFACT_DIR/deploy-output.txt"

          CONTRACT_ADDRESS="$(
            grep -i 'Contract Address:' "$ARTIFACT_DIR/deploy-output.txt" \
            | awk '{print $3}' \
            | tail -1
          )"
          DEPLOY_TX="$(
            grep -i 'Transaction Hash:' "$ARTIFACT_DIR/deploy-output.txt" \
            | awk '{print $3}' \
            | tail -1
          )"

          if [ -z "$CONTRACT_ADDRESS" ] || [ -z "$DEPLOY_TX" ]; then
            echo "Could not parse complete deployment result."
            exit 1
          fi

          {
            echo "contract_address=$CONTRACT_ADDRESS"
            echo "transaction_hash=$DEPLOY_TX"
          } >> "$GITHUB_OUTPUT"

      - name: Create Mainnet report
        if: always()
        run: |
          set -euo pipefail

          ARTIFACT_DIR="mainnet-artifacts/$CONTRACT_NAME"
          mkdir -p "$ARTIFACT_DIR"

          if [ "$DEPLOY_MODE" = "validate-only" ]; then
            DEPLOY_STATUS="skipped (validate-only)"
          else
            DEPLOY_STATUS="${{ steps.deploy.outcome }}"
          fi

          {
            echo "# VINSS Starknet Mainnet Report"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Mode | \`$DEPLOY_MODE\` |"
            echo "| Contract | \`$CONTRACT_NAME\` |"
            echo "| Network | Starknet Mainnet / SN_MAIN |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Build | \`${{ steps.build.outcome }}\` |"
            echo "| Tests | \`${{ steps.test.outcome }}\` |"
            echo "| Declare fee dry-run | \`${{ steps.declare_fee.outcome }}\` |"
            echo "| Declaration | \`${{ steps.declare.outcome }}\` |"
            echo "| Deploy fee dry-run | \`${{ steps.deploy_fee.outcome }}\` |"
            echo "| Deployment | \`$DEPLOY_STATUS\` |"
            echo "| Deployer | \`$ACCOUNT_ADDRESS\` |"
            echo "| Treasury | \`$TREASURY_ADDRESS\` |"
            echo "| Privacy Pool | \`$PRIVACY_POOL_ADDRESS\` |"
            echo "| Open-note token | \`$OPEN_NOTE_TOKEN_ADDRESS\` |"
            echo "| Class hash | \`${{ steps.declare.outputs.class_hash }}\` |"
            echo "| Declare tx | \`${{ steps.declare.outputs.transaction_hash }}\` |"
            echo "| Contract address | \`${{ steps.deploy.outputs.contract_address }}\` |"
            echo "| Deploy tx | \`${{ steps.deploy.outputs.transaction_hash }}\` |"
            echo
            echo "## Declaration fee estimate"
            echo '```text'
            tail -120 "$ARTIFACT_DIR/declare-fee-estimate.txt" 2>/dev/null || echo "Declaration fee estimation did not run."
            echo '```'
            echo
            echo "## Deployment fee estimate"
            echo '```text'
            tail -120 "$ARTIFACT_DIR/deploy-fee-estimate.txt" 2>/dev/null || echo "Deployment fee estimation requires a declared class and therefore only runs in deploy mode after declaration."
            echo '```'
            echo
            echo "## Tests"
            echo '```text'
            tail -120 test-output.txt 2>/dev/null || echo "Tests did not run."
            echo '```'
          } > "$ARTIFACT_DIR/mainnet-report.md"

          cat "$ARTIFACT_DIR/mainnet-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ABI, fee estimates and deployment bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vinss-mainnet-${{ inputs.contract }}-${{ inputs.mode }}
          path: contracts/mainnet-artifacts/${{ inputs.contract }}/
          retention-days: 90
          if-no-files-found: warn
