name: Deploy VINSS Contract - Mainnet

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Validate, deploy, or retry Voyager verification"
        required: true
        default: "validate-only"
        type: choice
        options:
          - validate-only
          - deploy
          - verify-only
      contract:
        description: "VINSS contract"
        required: true
        type: choice
        options:
          - VinssMessageHelper
          - VinssInvite
          - VinssOfferHelper
          - VinssPrivateEscrowHelper
          - VinssEscrowRekber
          - VinssSettlementCertificate
      confirm_mainnet:
        description: "Deploy mode only: type DEPLOY_MAINNET"
        required: false
        default: ""
        type: string
      class_hash:
        description: "Required only for verify-only"
        required: false
        default: ""
        type: string
      escrow_rekber_address:
        description: "Required only for VinssSettlementCertificate deploy"
        required: false
        default: ""
        type: string
      certificate_base_uri:
        description: "Settlement Certificate metadata base URI"
        required: false
        default: "https://vinss-nu.vercel.app/api/certificates/"
        type: string

concurrency:
  group: vinss-mainnet-contract-deploy
  cancel-in-progress: false

jobs:
  mainnet:
    name: ${{ inputs.mode }} · ${{ inputs.contract }} · Starknet Mainnet
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: mainnet

    defaults:
      run:
        working-directory: contracts
        shell: bash

    env:
      DEPLOY_MODE: ${{ inputs.mode }}
      CONTRACT_NAME: ${{ inputs.contract }}
      CONFIRM_MAINNET: ${{ inputs.confirm_mainnet }}
      INPUT_CLASS_HASH: ${{ inputs.class_hash }}
      ESCROW_REKBER_ADDRESS: ${{ inputs.escrow_rekber_address }}
      CERTIFICATE_BASE_URI: ${{ inputs.certificate_base_uri }}

      ACCOUNT_ADDRESS: ${{ vars.VINSS_MAINNET_DEPLOYER_ADDRESS }}
      PRIVACY_POOL_ADDRESS: ${{ vars.MAINNET_PRIVACY_POOL_ADDRESS }}
      OPEN_NOTE_TOKEN_ADDRESS: ${{ vars.MAINNET_OPEN_NOTE_TOKEN_ADDRESS }}
      TREASURY_ADDRESS: ${{ vars.VINSS_MAINNET_TREASURY_ADDRESS }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Mainnet safety gate
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Mainnet actions are only allowed from main."
            exit 1
          fi

          valid_address() {
            [[ "$1" =~ ^0x[0-9a-fA-F]{1,64}$ ]]
          }

          valid_hash() {
            [[ "$1" =~ ^0x[0-9a-fA-F]{1,64}$ ]]
          }

          case "$DEPLOY_MODE" in
            validate-only)
              echo "VALIDATE-ONLY: no transaction will be submitted."
              ;;
            deploy)
              if [ "$CONFIRM_MAINNET" != "DEPLOY_MAINNET" ]; then
                echo "Deploy mode requires confirm_mainnet=DEPLOY_MAINNET."
                exit 1
              fi
              ;;
            verify-only)
              if ! valid_hash "$INPUT_CLASS_HASH"; then
                echo "verify-only requires a valid class_hash."
                exit 1
              fi
              echo "VERIFY-ONLY: no transaction will be submitted."
              ;;
            *)
              echo "Unsupported mode: $DEPLOY_MODE"
              exit 1
              ;;
          esac

          if ! valid_address "$TREASURY_ADDRESS"; then
            echo "VINSS_MAINNET_TREASURY_ADDRESS is missing or invalid."
            exit 1
          fi

          if [ "$DEPLOY_MODE" != "verify-only" ]; then
            if ! valid_address "$ACCOUNT_ADDRESS"; then
              echo "VINSS_MAINNET_DEPLOYER_ADDRESS is missing or invalid."
              exit 1
            fi

            case "$CONTRACT_NAME" in
              VinssMessageHelper|VinssOfferHelper|VinssInvite)
                valid_address "$PRIVACY_POOL_ADDRESS" || {
                  echo "MAINNET_PRIVACY_POOL_ADDRESS is missing or invalid."
                  exit 1
                }
                valid_address "$OPEN_NOTE_TOKEN_ADDRESS" || {
                  echo "MAINNET_OPEN_NOTE_TOKEN_ADDRESS is missing or invalid."
                  exit 1
                }
                ;;
              VinssPrivateEscrowHelper|VinssEscrowRekber)
                valid_address "$PRIVACY_POOL_ADDRESS" || {
                  echo "MAINNET_PRIVACY_POOL_ADDRESS is missing or invalid."
                  exit 1
                }
                ;;
              VinssSettlementCertificate)
                valid_address "$ESCROW_REKBER_ADDRESS" || {
                  echo "A valid escrow_rekber_address is required."
                  exit 1
                }
                if ! [[ "$CERTIFICATE_BASE_URI" =~ ^https://[^\",[:space:]]+/$ ]]; then
                  echo "certificate_base_uri must be HTTPS and end with /."
                  exit 1
                fi
                ;;
              *)
                echo "Unsupported contract: $CONTRACT_NAME"
                exit 1
                ;;
            esac
          fi

      - name: Verify Starknet Mainnet RPC
        env:
          STARKNET_RPC_URL: ${{ secrets.STARKNET_MAINNET_RPC_URL }}
        run: |
          set -euo pipefail
          test -n "$STARKNET_RPC_URL"

          CHAIN_ID="$(
            curl --fail --silent --show-error \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"starknet_chainId","params":[]}' \
              "$STARKNET_RPC_URL" \
            | jq -r '.result // empty'
          )"

          if [ "$CHAIN_ID" != "0x534e5f4d41494e" ]; then
            echo "Refusing operation: RPC is not Starknet Mainnet."
            exit 1
          fi

          echo "RPC verified: SN_MAIN."

      # Build/test live in contracts-test.yml. This workflow does not rerun them.
      # Instead it requires a successful VINSS Contracts Test whose tested commit
      # has identical contracts/ content to the commit being deployed.
      - name: Require successful dedicated Contracts Test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/contracts-test.yml/runs?branch=main&status=success&per_page=30"

          TESTED_SHA="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API" \
            | jq -r '.workflow_runs[0].head_sha // empty'
          )"

          if [ -z "$TESTED_SHA" ]; then
            echo "No successful VINSS Contracts Test run was found."
            echo "Run contracts-test.yml first."
            exit 1
          fi

          git cat-file -e "${TESTED_SHA}^{commit}" 2>/dev/null || \
            git fetch --no-tags origin "$TESTED_SHA"

          if ! git diff --quiet "$TESTED_SHA" "$GITHUB_SHA" -- .; then
            echo "contracts/ changed since the last successful Contracts Test."
            echo "Tested SHA : $TESTED_SHA"
            echo "Current SHA: $GITHUB_SHA"
            echo "Run contracts-test.yml on current main before Mainnet."
            exit 1
          fi

          echo "Dedicated contract CI accepted."
          echo "Tested SHA : $TESTED_SHA"
          echo "Current SHA: $GITHUB_SHA"
          echo "No contracts/ changes since that successful test."

      - name: Setup Scarb
        uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd
        with:
          scarb-version: 2.17.0

      - name: Setup Starknet Foundry
        uses: foundry-rs/setup-snfoundry@bd5fc266ba0ce7e352b01dd7eaacc0fbb6145d17
        with:
          starknet-foundry-version: 0.63.0

      - name: Verify deployment toolchain
        run: |
          set -euo pipefail
          scarb --version
          VERSION="$(sncast --version)"
          echo "$VERSION"
          echo "$VERSION" | grep -q '0.63.0'

      # Build is intentionally kept here. GitHub Actions jobs use fresh runners,
      # so a successful build from contracts-test.yml is not available in this
      # deployment job unless compiled artifacts are explicitly transferred.
      # Tests remain in the dedicated Contracts Test workflow.
      - name: Build deployment artifacts
        id: build
        run: |
          set -euo pipefail
          set -o pipefail
          scarb build 2>&1 | tee build-output.txt

      - name: Import dedicated deployer
        if: inputs.mode != 'verify-only'
        env:
          STARKNET_RPC_URL: ${{ secrets.STARKNET_MAINNET_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.VINSS_MAINNET_DEPLOYER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077

          test -n "$STARKNET_RPC_URL"
          test -n "$PRIVATE_KEY"

          KEY_FILE="$RUNNER_TEMP/vinss-mainnet-deployer.key"
          printf '%s' "$PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          sncast account import \
            --url "$STARKNET_RPC_URL" \
            --name vinss-mainnet-deployer \
            --address "$ACCOUNT_ADDRESS" \
            --private-key-file "$KEY_FILE" \
            --type oz \
            --silent

          rm -f "$KEY_FILE"

      - name: Prepare constructor arguments
        id: constructor
        if: inputs.mode != 'verify-only'
        run: |
          set -euo pipefail

          case "$CONTRACT_NAME" in
            VinssMessageHelper|VinssOfferHelper|VinssInvite)
              DEPLOY_ARGS="$PRIVACY_POOL_ADDRESS, $OPEN_NOTE_TOKEN_ADDRESS"
              ;;
            VinssPrivateEscrowHelper|VinssEscrowRekber)
              DEPLOY_ARGS="$PRIVACY_POOL_ADDRESS"
              ;;
            VinssSettlementCertificate)
              DEPLOY_ARGS="$ESCROW_REKBER_ADDRESS, \"$CERTIFICATE_BASE_URI\""
              ;;
            *)
              echo "Unsupported contract: $CONTRACT_NAME"
              exit 1
              ;;
          esac

          echo "args=$DEPLOY_ARGS" >> "$GITHUB_OUTPUT"

      # Fee estimation uses the deployment artifacts built above.
      - name: Estimate Mainnet declaration fee
        id: declare_fee
        if: inputs.mode != 'verify-only'
        env:
          STARKNET_RPC_URL: ${{ secrets.STARKNET_MAINNET_RPC_URL }}
        run: |
          set -euo pipefail
          set -o pipefail

          ARTIFACT_DIR="mainnet-artifacts/$CONTRACT_NAME"
          mkdir -p "$ARTIFACT_DIR"

          echo "=== DECLARE DRY RUN: $CONTRACT_NAME ==="
          echo "No transaction is submitted."

          sncast \
            --scarb-profile dev \
            --account vinss-mainnet-deployer \
            declare \
            --url "$STARKNET_RPC_URL" \
            --contract-name "$CONTRACT_NAME" \
            --dry-run \
            --detailed \
            2>&1 | tee "$ARTIFACT_DIR/declare-fee-estimate.txt"

      - name: Export ABI from build artifacts
        id: abi
        if: inputs.mode != 'verify-only' && steps.declare_fee.outcome == 'success'
        run: |
          set -euo pipefail

          CLASS_FILE="$(
            find target/dev \
              -type f \
              -name "*_${CONTRACT_NAME}.contract_class.json" \
              -print \
            | head -1
          )"

          if [ -z "$CLASS_FILE" ] || [ ! -f "$CLASS_FILE" ]; then
            echo "Contract class artifact not found after sncast declaration dry-run."
            exit 1
          fi

          ARTIFACT_DIR="mainnet-artifacts/$CONTRACT_NAME"
          mkdir -p "$ARTIFACT_DIR"

          jq '.abi' "$CLASS_FILE" > "$ARTIFACT_DIR/${CONTRACT_NAME}.abi.json"
          sha256sum "$CLASS_FILE" > "$ARTIFACT_DIR/compiled-class.sha256"

          echo "artifact_dir=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"
          echo "ABI exported."

      - name: Declare class on Mainnet
        id: declare
        if: inputs.mode == 'deploy'
        env:
          STARKNET_RPC_URL: ${{ secrets.STARKNET_MAINNET_RPC_URL }}
        run: |
          set -euo pipefail
          set -o pipefail

          ARTIFACT_DIR="mainnet-artifacts/$CONTRACT_NAME"

          sncast \
            --scarb-profile dev \
            --account vinss-mainnet-deployer \
            --wait \
            --wait-timeout 300 \
            declare \
            --url "$STARKNET_RPC_URL" \
            --contract-name "$CONTRACT_NAME" \
            2>&1 | tee "$ARTIFACT_DIR/declare-output.txt"

          CLASS_HASH="$(
            grep -i 'Class Hash:' "$ARTIFACT_DIR/declare-output.txt" \
            | awk '{print $3}' \
            | tail -1
          )"
          DECLARE_TX="$(
            grep -i 'Transaction Hash:' "$ARTIFACT_DIR/declare-output.txt" \
            | awk '{print $3}' \
            | tail -1
          )"

          if [ -z "$CLASS_HASH" ]; then
            echo "Could not parse class hash."
            exit 1
          fi

          {
            echo "class_hash=$CLASS_HASH"
            echo "transaction_hash=$DECLARE_TX"
          } >> "$GITHUB_OUTPUT"

      - name: Estimate Mainnet deployment fee
        id: deploy_fee
        if: inputs.mode == 'deploy' && steps.declare.outcome == 'success'
        env:
          STARKNET_RPC_URL: ${{ secrets.STARKNET_MAINNET_RPC_URL }}
          DEPLOY_ARGS: ${{ steps.constructor.outputs.args }}
        run: |
          set -euo pipefail
          set -o pipefail

          ARTIFACT_DIR="mainnet-artifacts/$CONTRACT_NAME"

          sncast \
            --scarb-profile dev \
            --account vinss-mainnet-deployer \
            deploy \
            --url "$STARKNET_RPC_URL" \
            --contract-name "$CONTRACT_NAME" \
            --arguments "$DEPLOY_ARGS" \
            --dry-run \
            --detailed \
            2>&1 | tee "$ARTIFACT_DIR/deploy-fee-estimate.txt"

      - name: Deploy contract instance to Mainnet
        id: deploy
        if: inputs.mode == 'deploy' && steps.declare.outcome == 'success' && steps.deploy_fee.outcome == 'success'
        env:
          STARKNET_RPC_URL: ${{ secrets.STARKNET_MAINNET_RPC_URL }}
          DEPLOY_ARGS: ${{ steps.constructor.outputs.args }}
        run: |
          set -euo pipefail
          set -o pipefail

          ARTIFACT_DIR="mainnet-artifacts/$CONTRACT_NAME"

          sncast \
            --scarb-profile dev \
            --account vinss-mainnet-deployer \
            --wait \
            --wait-timeout 300 \
            deploy \
            --url "$STARKNET_RPC_URL" \
            --contract-name "$CONTRACT_NAME" \
            --arguments "$DEPLOY_ARGS" \
            2>&1 | tee "$ARTIFACT_DIR/deploy-output.txt"

          CONTRACT_ADDRESS="$(
            grep -i 'Contract Address:' "$ARTIFACT_DIR/deploy-output.txt" \
            | awk '{print $3}' \
            | tail -1
          )"
          DEPLOY_TX="$(
            grep -i 'Transaction Hash:' "$ARTIFACT_DIR/deploy-output.txt" \
            | awk '{print $3}' \
            | tail -1
          )"

          if [ -z "$CONTRACT_ADDRESS" ] || [ -z "$DEPLOY_TX" ]; then
            echo "Could not parse deployment result."
            exit 1
          fi

          {
            echo "contract_address=$CONTRACT_ADDRESS"
            echo "transaction_hash=$DEPLOY_TX"
          } >> "$GITHUB_OUTPUT"

      - name: Submit source verification to Voyager
        id: verify
        if: inputs.mode == 'verify-only' || (inputs.mode == 'deploy' && steps.deploy.outcome == 'success')
        continue-on-error: true
        env:
          STARKNET_RPC_URL: ${{ secrets.STARKNET_MAINNET_RPC_URL }}
          DEPLOY_CLASS_HASH: ${{ steps.declare.outputs.class_hash }}
        run: |
          set -euo pipefail
          set -o pipefail

          ARTIFACT_DIR="mainnet-artifacts/$CONTRACT_NAME"
          mkdir -p "$ARTIFACT_DIR"

          if [ "$DEPLOY_MODE" = "verify-only" ]; then
            VERIFY_CLASS_HASH="$INPUT_CLASS_HASH"
          else
            VERIFY_CLASS_HASH="$DEPLOY_CLASS_HASH"
          fi

          test -n "$VERIFY_CLASS_HASH"

          echo "Submitting $CONTRACT_NAME ($VERIFY_CLASS_HASH) to Voyager..."

          sncast \
            verify \
            --url "$STARKNET_RPC_URL" \
            --class-hash "$VERIFY_CLASS_HASH" \
            --contract-name "$CONTRACT_NAME" \
            --verifier voyager \
            --network mainnet \
            --confirm-verification \
            2>&1 | tee "$ARTIFACT_DIR/voyager-verification.txt"

      - name: Create Mainnet report
        if: always()
        run: |
          set -euo pipefail

          ARTIFACT_DIR="mainnet-artifacts/$CONTRACT_NAME"
          mkdir -p "$ARTIFACT_DIR"

          {
            echo "# VINSS Mainnet Operation Report"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Mode | \`$DEPLOY_MODE\` |"
            echo "| Contract | \`$CONTRACT_NAME\` |"
            echo "| Network | Starknet Mainnet / SN_MAIN |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Deployment build | \`${{ steps.build.outcome }}\` |"
            echo "| Dedicated Contracts CI gate | \`${{ steps.declare_fee.outcome != 'skipped' || steps.verify.outcome != 'skipped' }}\` |"
            echo "| Declaration fee dry-run | \`${{ steps.declare_fee.outcome }}\` |"
            echo "| Declaration | \`${{ steps.declare.outcome }}\` |"
            echo "| Deployment fee dry-run | \`${{ steps.deploy_fee.outcome }}\` |"
            echo "| Deployment | \`${{ steps.deploy.outcome }}\` |"
            echo "| Voyager verification | \`${{ steps.verify.outcome }}\` |"
            echo "| Deployer | \`$ACCOUNT_ADDRESS\` |"
            echo "| Treasury | \`$TREASURY_ADDRESS\` |"
            echo "| Class hash | \`${{ steps.declare.outputs.class_hash || inputs.class_hash }}\` |"
            echo "| Declare tx | \`${{ steps.declare.outputs.transaction_hash }}\` |"
            echo "| Contract address | \`${{ steps.deploy.outputs.contract_address }}\` |"
            echo "| Deploy tx | \`${{ steps.deploy.outputs.transaction_hash }}\` |"
            echo
            echo "## Declaration fee estimate"
            echo '```text'
            tail -100 "$ARTIFACT_DIR/declare-fee-estimate.txt" 2>/dev/null || echo "Not run."
            echo '```'
            echo
            echo "## Deployment fee estimate"
            echo '```text'
            tail -100 "$ARTIFACT_DIR/deploy-fee-estimate.txt" 2>/dev/null || echo "Not run."
            echo '```'
            echo
            echo "## Voyager verification"
            echo '```text'
            tail -80 "$ARTIFACT_DIR/voyager-verification.txt" 2>/dev/null || echo "Not run."
            echo '```'
          } > "$ARTIFACT_DIR/mainnet-report.md"

          cat "$ARTIFACT_DIR/mainnet-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ABI, fee and verification bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vinss-mainnet-${{ inputs.contract }}-${{ inputs.mode }}
          path: contracts/mainnet-artifacts/${{ inputs.contract }}/
          retention-days: 90
          if-no-files-found: warn
