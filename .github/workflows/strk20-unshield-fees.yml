name: VINSS STRK20 Unshield + Fees
on:
  push:
    branches:
      - feat/strk20-unshield-fees
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unshield regression tests
        run: node --experimental-strip-types --test tests/strk20-unshield.test.mjs
      - name: Shield and Unshield UI regression
        run: node --experimental-strip-types --test tests/strk20-shield-ui.test.mjs
      - name: Public transfer calldata and mode regression
        run: node --experimental-strip-types --test tests/vinss-public-transfer-mode.test.mjs tests/vinss-public-transfer-receipt.test.mjs tests/vinss-public-rail.test.mjs
      - name: Unshield network guard regression
        run: node --experimental-strip-types --test tests/strk20-unshield-network.test.mjs
      - name: Fee policy regression
        run: node --test tests/fee-reduction.test.mjs
      - name: Sepolia read-only fee audit regression
        run: node --test tests/sepolia-fee-audit.test.mjs
      - name: Sepolia Unshield receipt regression
        run: node --test tests/sepolia-unshield-receipt.test.mjs
      - name: On-chain fee transparency tests
        run: node --experimental-strip-types --test tests/strk20-fee-display.test.mjs
      - name: Shield vs Unshield fee transparency regression
        run: node --test tests/strk20-shield-unshield-fees.test.mjs
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Messaging codec and multichain adapter regression
        run: node --experimental-strip-types --test tests/messaging-codec-transport.test.mjs
      - name: Messaging production wiring regression
        run: node --test tests/messaging-production-wiring.test.mjs
      - name: Install backend test tools
        run: npm ci --prefix backend
      - name: Full public rail runtime regression
        run: TSX_TSCONFIG_PATH=frontend/tsconfig.json node --import ./backend/node_modules/tsx/dist/loader.mjs --test frontend/tests/*.test.ts
      - name: Backend regression tests
        run: node --import ./backend/node_modules/tsx/dist/loader.mjs --test backend/tests/*.test.ts
      - name: Backend typecheck and build
        run: |
          npm --prefix backend run typecheck
          npm --prefix backend run build
      - name: Typecheck
        run: npm --prefix frontend run typecheck
      - name: Production build
        run: npm --prefix frontend run build
      - name: Privacy regression
        run: node scripts/test-privacy-boundaries.mjs

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: 2.20.1
          cache: false
      - uses: foundry-rs/setup-snfoundry@v3
        with:
          starknet-foundry-version: 0.56.0
      - run: scarb build
      - run: snforge test

  deploy-public-sepolia:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-unshield-sepolia]')
    needs: [verify, contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: vinss-public-sepolia-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Sepolia deployment configuration
        env:
          STARKNET_RPC_URL: ${{ secrets.STARKNET_SEPOLIA_RPC_URL }}
          ACCOUNT_ADDRESS: ${{ secrets.VEIL_POC_ACCOUNT_ADDRESS }}
          PRIVATE_KEY: ${{ secrets.VEIL_POC_ACCOUNT_PRIVATE_KEY }}
          VINSS_SEPOLIA_TREASURY_ADDRESS: "0x03A2662aDF2E7E37CDB015577bCa13F5c6B5E62ffe7D3aF3D66412f0178e8009"
        run: |
          node - <<'JS'
          const required = ['STARKNET_RPC_URL', 'ACCOUNT_ADDRESS', 'PRIVATE_KEY', 'VINSS_SEPOLIA_TREASURY_ADDRESS'];
          const missing = required.filter(name => !process.env[name]);
          if (missing.length) {
            console.error('Required CI configuration missing: ' + missing.join(', '));
            process.exit(1);
          }
          JS
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: 2.20.1
          cache: false
      - run: scarb build
        working-directory: contracts
      - run: npm ci
        working-directory: backend
      - name: Deploy and verify full Unshield rail
        working-directory: backend
        env:
          STARKNET_RPC_URL: ${{ secrets.STARKNET_SEPOLIA_RPC_URL }}
          ACCOUNT_ADDRESS: ${{ secrets.VEIL_POC_ACCOUNT_ADDRESS }}
          PRIVATE_KEY: ${{ secrets.VEIL_POC_ACCOUNT_PRIVATE_KEY }}
          VINSS_SEPOLIA_TREASURY_ADDRESS: "0x03A2662aDF2E7E37CDB015577bCa13F5c6B5E62ffe7D3aF3D66412f0178e8009"
        run: node scripts/deploy-public-sepolia.mjs
      - name: Save deployment addresses and application configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-sepolia-deployment
          path: backend/deployment-public-sepolia/
          if-no-files-found: ignore
          retention-days: 90
