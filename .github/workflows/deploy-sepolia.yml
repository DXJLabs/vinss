name: Deploy VINSS Contracts - Sepolia

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: contracts

    env:
      STARKNET_RPC_URL: ${{ secrets.STARKNET_SEPOLIA_RPC_URL }}
      ACCOUNT_ADDRESS: ${{ secrets.VEIL_POC_ACCOUNT_ADDRESS }}
      PRIVATE_KEY: ${{ secrets.VEIL_POC_ACCOUNT_PRIVATE_KEY }}
      PRIVACY_POOL_ADDRESS: "0x0254a6b2997ef52e9f830ce1f543f6b29768295e8d17e2267d672c552cfe0d91"
      OPEN_NOTE_TOKEN_ADDRESS: "0x04718f5a0fc34cc1af16a1cdee98ffb20c31f5cd61d6ab07201858f4287c938d"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Scarb
        uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: 2.17.0

      - name: Setup Starknet Foundry
        uses: foundry-rs/setup-snfoundry@v3
        with:
          starknet-foundry-version: 0.56.0

      - name: Build
        run: scarb build

      - name: Test
        run: snforge test

      - name: Validate secrets
        run: |
          test -n "$STARKNET_RPC_URL"
          test -n "$ACCOUNT_ADDRESS"
          test -n "$PRIVATE_KEY"

      - name: Create deploy account
        run: |
          sncast account import \
            --url "$STARKNET_RPC_URL" \
            --name vinss-deployer \
            --address "$ACCOUNT_ADDRESS" \
            --private-key "$PRIVATE_KEY" \
            --type oz \
            --silent

      - name: Declare and deploy VINSS contracts
        run: |
          DEPLOY_REPORT=""

          deploy() {
            NAME="$1"

            echo "=== DECLARE $NAME ==="

            sleep 15

            OUTPUT=$(sncast \
              --account vinss-deployer \
              declare \
              --url "$STARKNET_RPC_URL" \
              --contract-name "$NAME" 2>&1) || true

            echo "$OUTPUT"

            CLASS_HASH=$(echo "$OUTPUT" | grep -i "Class Hash:" | awk '{print $3}')

            if echo "$OUTPUT" | grep -qi "already declared"; then
              echo "$NAME already declared."
            elif [ -z "$CLASS_HASH" ]; then
              echo "Declaration failed for $NAME"
              exit 1
            else
              TX_HASH=$(echo "$OUTPUT" | grep -i "Transaction Hash:" | awk '{print $3}')
              echo "Waiting for declaration transaction: $TX_HASH"

              for i in {1..30}; do
                RECEIPT=$(sncast receipt \
                  --url "$STARKNET_RPC_URL" \
                  --transaction-hash "$TX_HASH" 2>/dev/null || true)

                echo "$RECEIPT" | grep -qi "ACCEPTED" && break
                sleep 5
              done
            fi

            if [ -z "$CLASS_HASH" ]; then
              CLASS_HASH=$(echo "$OUTPUT" | grep -oE '0x[0-9a-fA-F]{50,66}' | head -1)
            fi

            if [ -z "$CLASS_HASH" ]; then
              echo "Could not determine class hash for $NAME"
              exit 1
            fi

            echo "=== DEPLOY $NAME ==="

            if [ "$NAME" = "VinssMessageHelper" ]; then
              DEPLOY_ARGS="$PRIVACY_POOL_ADDRESS, $OPEN_NOTE_TOKEN_ADDRESS"
            else
              DEPLOY_ARGS="$PRIVACY_POOL_ADDRESS"
            fi

            DEPLOY_OUTPUT=$(sncast \
              --account vinss-deployer \
              deploy \
              --url "$STARKNET_RPC_URL" \
              --class-hash "$CLASS_HASH" \
              --arguments "$DEPLOY_ARGS")

            echo "$DEPLOY_OUTPUT"

            CONTRACT_ADDRESS=$(echo "$DEPLOY_OUTPUT" | grep -i "Contract Address:" | awk '{print $3}')
            DEPLOY_TX=$(echo "$DEPLOY_OUTPUT" | grep -i "Transaction Hash:" | awk '{print $3}')

            DEPLOY_REPORT="${DEPLOY_REPORT}
          $NAME
            Class Hash: $CLASS_HASH
            Contract:   $CONTRACT_ADDRESS
            Tx:         $DEPLOY_TX
          "
          }

          deploy "VinssMessageHelper"
          deploy "VinssInvite"
          deploy "VinssOfferHelper"
          deploy "VinssClaimEscrow"
          deploy "VinssPrivateEscrowHelper"
          deploy "VinssPrivateEscrowSettlement"

          echo ""
          echo "=========================================="
          echo "       VINSS SEPOLIA DEPLOYMENT DONE"
          echo "=========================================="
          echo "$DEPLOY_REPORT"
          echo "Privacy Pool: $PRIVACY_POOL_ADDRESS"
          echo "=========================================="
