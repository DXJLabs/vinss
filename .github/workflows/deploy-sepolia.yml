name: Deploy VINSS Contract - Sepolia

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      contract:
        description: "Contract to deploy"
        required: true
        type: choice
        options:
          - VinssMessageHelper
          - VinssInvite
          - VinssOfferHelper
          - VinssPrivateEscrowHelper
          - VinssEscrowRekber

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: contracts

    env:
      STARKNET_RPC_URL: ${{ secrets.STARKNET_SEPOLIA_RPC_URL }}
      ACCOUNT_ADDRESS: ${{ secrets.VEIL_POC_ACCOUNT_ADDRESS }}
      PRIVATE_KEY: ${{ secrets.VEIL_POC_ACCOUNT_PRIVATE_KEY }}
      PRIVACY_POOL_ADDRESS: "0x0254a6b2997ef52e9f830ce1f543f6b29768295e8d17e2267d672c552cfe0d91"
      OPEN_NOTE_TOKEN_ADDRESS: "0x04718f5a0fc34cc1af16a1cdee98ffb20c31f5cd61d6ab07201858f4287c938d"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Scarb
        uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: 2.17.0

      - name: Setup Starknet Foundry
        uses: foundry-rs/setup-snfoundry@v3
        with:
          starknet-foundry-version: 0.56.0

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          scarb build 2>&1 | tee build-output.txt

      - name: Declare and deploy
        id: deploy
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          CONTRACT_NAME: ${{ inputs.contract }}
        run: |
          set -e

          echo "class_hash=" >> "$GITHUB_OUTPUT"
          echo "contract_address=" >> "$GITHUB_OUTPUT"
          echo "transaction_hash=" >> "$GITHUB_OUTPUT"

          test -n "$STARKNET_RPC_URL"
          test -n "$ACCOUNT_ADDRESS"
          test -n "$PRIVATE_KEY"

          sncast account import \
            --url "$STARKNET_RPC_URL" \
            --name vinss-deployer \
            --address "$ACCOUNT_ADDRESS" \
            --private-key "$PRIVATE_KEY" \
            --type oz \
            --silent

          echo "=== DECLARE $CONTRACT_NAME ==="

          OUTPUT=$(sncast \
            --account vinss-deployer \
            --wait \
            --wait-timeout 180 \
            declare \
            --url "$STARKNET_RPC_URL" \
            --contract-name "$CONTRACT_NAME" 2>&1) || true

          echo "$OUTPUT" | tee declare-output.txt

          CLASS_HASH=$(echo "$OUTPUT" \
            | grep -i "Class Hash:" \
            | awk '{print $3}' \
            | head -1)

          if [ -z "$CLASS_HASH" ]; then
            CLASS_HASH=$(echo "$OUTPUT" \
              | grep -oE '0x[0-9a-fA-F]{50,66}' \
              | head -1)
          fi

          if [ -z "$CLASS_HASH" ]; then
            echo "Could not determine class hash"
            exit 1
          fi

          echo "class_hash=$CLASS_HASH" >> "$GITHUB_OUTPUT"

          if [ "$CONTRACT_NAME" = "VinssMessageHelper" ] || \
             [ "$CONTRACT_NAME" = "VinssOfferHelper" ] || \
             [ "$CONTRACT_NAME" = "VinssInvite" ]; then
            DEPLOY_ARGS="$PRIVACY_POOL_ADDRESS, $OPEN_NOTE_TOKEN_ADDRESS"
          else
            DEPLOY_ARGS="$PRIVACY_POOL_ADDRESS"
          fi

          echo "=== DEPLOY $CONTRACT_NAME ==="

          DEPLOY_OUTPUT=$(sncast \
            --account vinss-deployer \
            --wait \
            --wait-timeout 180 \
            deploy \
            --url "$STARKNET_RPC_URL" \
            --class-hash "$CLASS_HASH" \
            --arguments "$DEPLOY_ARGS" 2>&1) || true

          echo "$DEPLOY_OUTPUT" | tee deploy-output.txt

          CONTRACT_ADDRESS=$(echo "$DEPLOY_OUTPUT" \
            | grep -i "Contract Address:" \
            | awk '{print $3}' \
            | tail -1)

          TX_HASH=$(echo "$DEPLOY_OUTPUT" \
            | grep -i "Transaction Hash:" \
            | awk '{print $3}' \
            | tail -1)

          if [ -z "$CONTRACT_ADDRESS" ] || [ -z "$TX_HASH" ]; then
            echo "Deployment did not produce contract address / tx hash"
            exit 1
          fi

          echo "contract_address=$CONTRACT_ADDRESS" >> "$GITHUB_OUTPUT"
          echo "transaction_hash=$TX_HASH" >> "$GITHUB_OUTPUT"

      - name: Create Markdown report
        if: always()
        run: |
          BUILD="${{ steps.build.outcome }}"
          DEPLOY="${{ steps.deploy.outcome }}"

          [ "$BUILD" = "success" ] && BUILD_ICON="✅" || BUILD_ICON="❌"
          [ "$DEPLOY" = "success" ] && DEPLOY_ICON="✅" || DEPLOY_ICON="❌"

          {
            echo "# VINSS Sepolia Deployment Report"
            echo ""
            echo "## ${{ inputs.contract }}"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Build | $BUILD_ICON $BUILD |"
            echo "| Deploy | $DEPLOY_ICON $DEPLOY |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Network | Sepolia |"
            echo "| Class Hash | \`${{ steps.deploy.outputs.class_hash }}\` |"
            echo "| Contract | \`${{ steps.deploy.outputs.contract_address }}\` |"
            echo "| Transaction | \`${{ steps.deploy.outputs.transaction_hash }}\` |"
            echo ""
            echo "## Build log"
            echo '```text'
            tail -60 build-output.txt 2>/dev/null || echo "No build output"
            echo '```'
          } > deploy-report.md

          cat deploy-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Markdown report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinss-${{ inputs.contract }}-deployment-report
          path: contracts/deploy-report.md
          retention-days: 30

      - name: Update permanent deployment history
        if: always() && github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin main

          mkdir -p reports

          if [ ! -f reports/DEPLOYMENTS.md ]; then
            printf '%s\n' \
              '# VINSS Sepolia Deployment History' \
              '' \
              '| Date | Contract | Status | Class Hash | Contract | Transaction | Commit | Run |' \
              '|---|---|---|---|---|---|---|---|' \
              > reports/DEPLOYMENTS.md
          fi

          BUILD="${{ steps.build.outcome }}"
          DEPLOY="${{ steps.deploy.outcome }}"
          CLASS_HASH="${{ steps.deploy.outputs.class_hash }}"
          ADDRESS="${{ steps.deploy.outputs.contract_address }}"
          TX_HASH="${{ steps.deploy.outputs.transaction_hash }}"
          CONTRACT_NAME="${{ inputs.contract }}"

          if [ "$BUILD" = "success" ] && [ "$DEPLOY" = "success" ]; then
            STATUS="✅ DEPLOYED"
          else
            STATUS="❌ FAILED"
          fi

          DATE="$(TZ=Asia/Makassar date '+%Y-%m-%d %H:%M WITA')"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          VOYAGER="https://sepolia.voyager.online"

          CLASS_CELL="-"
          CONTRACT_CELL="-"
          TX_CELL="-"

          [ -n "$CLASS_HASH" ] && CLASS_CELL="\`$CLASS_HASH\`"
          [ -n "$ADDRESS" ] && CONTRACT_CELL="[Voyager]($VOYAGER/contract/$ADDRESS)"
          [ -n "$TX_HASH" ] && TX_CELL="[Voyager]($VOYAGER/tx/$TX_HASH)"

          if ! grep -q "| ${GITHUB_RUN_ID} |" reports/DEPLOYMENTS.md 2>/dev/null; then
            printf '| %s | %s | %s | %s | %s | %s | `%s` | [Run](%s) <!-- | %s | -->\n' \
              "$DATE" \
              "$CONTRACT_NAME" \
              "$STATUS" \
              "$CLASS_CELL" \
              "$CONTRACT_CELL" \
              "$TX_CELL" \
              "$SHORT_SHA" \
              "$RUN_URL" \
              "$GITHUB_RUN_ID" \
              >> reports/DEPLOYMENTS.md
          fi

          git add reports/DEPLOYMENTS.md

          git diff --cached --quiet || \
            git commit -m "docs: update deployment report"

          git push origin HEAD:main

      - name: Fail workflow when deployment fails
        if: always() && (steps.build.outcome != 'success' || steps.deploy.outcome != 'success')
        run: exit 1
